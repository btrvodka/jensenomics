<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Удержи экономику — как играть</title>
<style>
:root{--bg:#0d0f12;--pn:#161a20;--pn2:#1d222a;--ln:#2a3038;--ink:#e8ecf1;--dim:#9aa4b1;--fc:#ff6a13;--ok:#3ddc97;--hl:#ffcc00}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Bahnschrift,'Segoe UI',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 20px}
.top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.kick{color:var(--fc);letter-spacing:.14em;font-size:12px;text-transform:uppercase}
h1{margin:0;font-size:22px}.ver{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.where{display:flex;gap:8px;margin-top:10px}.where input{flex:1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-bottom:2px solid var(--fc);color:var(--ink);font:inherit;font-size:18px;padding:9px 12px}
.where button,.btn{background:var(--pn2);color:var(--ink);border:1px solid var(--ln);font:inherit;padding:8px 14px;cursor:pointer;min-height:44px}
.qbtn{font-size:22px;font-weight:700;color:var(--fc);width:52px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--pn);border:1px solid var(--ln);color:var(--dim);padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{color:var(--ink);border-color:var(--fc)}
.how{color:var(--dim);font-size:13px;margin-top:6px}
main{padding:14px 20px 40px;display:grid;gap:14px}
.card{background:var(--pn);border-top:3px solid var(--c,var(--fc));padding:12px 14px}
.card h2{margin:0 0 4px;font-size:19px}.tags{color:var(--dim);font-size:12px}.tags b{color:var(--ink);font-weight:400}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:2px 0}
.dev{display:inline-block;background:#3a2a10;color:var(--hl);font-size:12px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.shot{position:relative;background:#000;cursor:zoom-in;border:1px solid var(--ln);overflow:hidden}
.shot img{display:block;width:100%;height:auto}
.shot .lb{position:absolute;left:0;top:0;background:rgba(13,15,18,.86);padding:3px 9px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.shot.was .lb{color:var(--dim)}.shot.now .lb{color:var(--ok)}
.box{position:absolute;border:3px solid var(--hl);box-shadow:0 0 0 2px rgba(0,0,0,.65),0 0 16px var(--hl);animation:pulse 1.6s ease-in-out 2}
.box i{position:absolute;right:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--hl);color:#111;font-style:normal;font-weight:700;display:grid;place-items:center;font-size:12px}
@keyframes pulse{50%{border-color:#fff}}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rate button{background:var(--pn2);border:1px solid var(--ln);font-size:18px;min-width:44px;min-height:40px;cursor:pointer}
.rate button.on{border-color:var(--fc);background:#2b1a10}
.rate textarea,.gen textarea{width:100%;min-height:54px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);font:inherit;padding:6px 8px;margin-top:6px}
.saved{color:var(--dim);font-size:12px}
.empty{background:var(--pn);padding:14px;border-left:3px solid var(--hl)}
.gen{background:var(--pn);padding:12px 14px;border-top:3px solid var(--dim)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:9;align-items:center;justify-content:center;cursor:zoom-out}
.zoom.on{display:flex}.zoom .shot{width:min(96vw,1600px);cursor:zoom-out}
.hide{display:none}
@media (max-width:760px){header{position:static;padding:10px 12px}main{padding:10px 12px}.pair{grid-template-columns:1fr}h1{font-size:19px}}
</style></head><body>

const ST={mode:'local',token:'',texts:{}};const LS='spravka:'+D.report;
async function api(m,p,b){const h={};if(b)h['Content-Type']='application/json';if(ST.token)h['X-Workmode-Token']=ST.token;
  const r=await fetch(p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){if(location.pathname.startsWith('/r/')){try{ST.token=(await api('GET','/api/config')).token;
  const s=await api('GET','/api/report-state?name='+encodeURIComponent(D.report));ST.texts=s.texts||{};ST.mode='server';return}catch(e){}}
  try{ST.texts=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ST.texts={}}}
async function put(id,val){const text=val?JSON.stringify(val):'';const at=new Date().toTimeString().slice(0,5);
  if(ST.mode==='server'){await api('POST','/api/report-state',{name:D.report,text_id:id,text});}
  if(text)ST.texts[id]={text,at};else delete ST.texts[id];if(ST.mode!=='server')localStorage.setItem(LS,JSON.stringify(ST.texts));
  return ST.mode==='server'?`✓ Сохранено в ${at} — видно с любого ПК`:`✓ Сохранено в ${at} — только в этом браузере`}
const get=id=>{try{return JSON.parse(ST.texts[id].text)}catch(e){return null}};
const MARKS=[['⭐','лучшее'],['🟩','хорошо'],['🟨','так себе'],['🟥','не надо'],['❓','не понял']];
function shot(s,cls,lb){if(!s)return'';return`<div class="shot ${cls}" data-z><img src="${s.src}" alt="${esc(lb)}" loading="lazy"><span class="lb">${esc(lb)}</span>${(s.boxes||[]).map((b,i)=>`<div class="box" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%"><i>${i+1}</i></div>`).join('')}</div>`}
function card(c){const r=get('r:'+c.id)||{};return`<section class="card" id="c-${c.id}" style="--c:${c.color||'var(--fc)'}">
<h2>${esc(c.q)}${c.dev?'<span class="dev">в разработке</span>':''}</h2><div class="tags">ещё говорят: <b>${c.tags.map(esc).join(' · ')}</b></div>
<ol class="steps">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
<div class="pair">${shot(c.was,'was',c.was&&c.was.label||'Было')}${shot(c.now,'now',c.now&&c.now.label||'Стало')}</div>
<div class="rate" data-id="${c.id}">${MARKS.map(([m,t])=>`<button title="${t}" data-m="${m}" class="${r.mark===m?'on':''}">${m}</button>`).join('')}
<button data-c title="Комментарий">💬</button><span class="saved"></span><textarea class="${r.comment?'':'hide'}" placeholder="Что непонятно или не так">${esc(r.comment||'')}</textarea></div></section>`}
function render(list,query){const m=$('#main');
  const miss=query&&!list.length?`<div class="empty">Не нашёл «${esc(query)}». Напиши, как ты это называешь и что ищешь, — справку дополнят.<textarea id="missT">${esc(query)}</textarea><button class="btn" id="missB">Сообщить, чего не хватает</button> <span class="saved" id="missS"></span></div>`:'';
  m.innerHTML=miss+list.map(card).join('')+`<div class="gen"><b>Общий комментарий к справке</b><textarea id="genT">${esc((get('general')||{}).comment||'')}</textarea><button class="btn" id="genB">Сохранить</button> <span class="saved" id="genS"></span></div>`}
function search(){const q=norm($('#q').value);if(!q){render(D.cards);return}
  const STOP=new Set(['где','как','что','это','для','при','мой','мои','мне','или','над','под','про','все','всё']);const words=q.split(' ').filter(w=>w.length>2&&!STOP.has(w));if(!words.length){render(D.cards);return}
  const score=c=>{const hay=norm([c.q,...c.tags,...c.steps].join(' '));return words.reduce((n,w)=>n+(hay.includes(w)?2:hay.includes(w.slice(0,Math.max(4,w.length-2)))?1:0),0)};
  const hits=D.cards.map(c=>[score(c),c]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);render(hits,$('#q').value.trim())}
$('#chips').innerHTML=D.cards.map(c=>`<button class="chip" data-chip="${c.id}">${esc(c.q)}</button>`).join('');
document.addEventListener('click',async e=>{const t=e.target;
  if(t.dataset.chip){$('#q').value='';render(D.cards);document.getElementById('c-'+t.dataset.chip).scrollIntoView({behavior:'smooth',block:'start'});return}
  const z=t.closest('[data-z]');if(z&&!t.closest('#zoom')){$('#zoom').innerHTML=z.outerHTML;$('#zoom').classList.add('on');return}
  if(t.closest('#zoom')){$('#zoom').classList.remove('on');return}
  const rate=t.closest('.rate');if(rate&&t.tagName==='BUTTON'){const id='r:'+rate.dataset.id,cur=get(id)||{},ta=rate.querySelector('textarea');
    if('c' in t.dataset){ta.classList.toggle('hide');if(!ta.classList.contains('hide'))ta.focus();return}
    const mark=cur.mark===t.dataset.m?'':t.dataset.m;rate.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mark));
    const sv=rate.querySelector('.saved');sv.textContent='● Сохраняю…';try{sv.textContent=await put(id,mark||cur.comment?{mark,comment:cur.comment||''}:null)}catch(err){sv.textContent='× Не сохранилось — повтори'}return}
  if(t.id==='qb'){search();return}
  if(t.id==='genB'){$('#genS').textContent='● Сохраняю…';try{$('#genS').textContent=await put('general',{comment:$('#genT').value})}catch(err){$('#genS').textContent='× Не сохранилось'}return}
  if(t.id==='missB'){$('#missS').textContent='● Сохраняю…';try{$('#missS').textContent=await put('miss:'+Date.now(),{query:$('#missT').value})}catch(err){$('#missS').textContent='× Не сохранилось'}}});
document.addEventListener('change',async e=>{const ta=e.target;const rate=ta.closest&&ta.closest('.rate');if(!rate||ta.tagName!=='TEXTAREA')return;
  const id='r:'+rate.dataset.id,cur=get(id)||{},sv=rate.querySelector('.saved');sv.textContent='● Сохраняю…';
  try{sv.textContent=await put(id,cur.mark||ta.value?{mark:cur.mark||'',comment:ta.value}:null)}catch(err){sv.textContent='× Не сохранилось — повтори'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#zoom').classList.remove('on')});
$('#q').addEventListener('input',search);
load().then(()=>{const p=new URLSearchParams(location.search).get('q');if(p){$('#q').value=p;search()}else render(D.cards)});
</script></body></html>
